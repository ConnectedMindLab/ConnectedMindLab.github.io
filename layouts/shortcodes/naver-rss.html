{{ with site.Data.naver_blog }}
  {{ with .items }}
  <ul class="naver-blog-posts" style="list-style:none; padding:0;">
    {{ range . }}
    <li style="margin-bottom:1.2em; border-bottom:1px solid #eee; padding-bottom:1em;">
      <a href="{{ .link }}" target="_blank" rel="noopener noreferrer" style="font-size:1.05em; font-weight:500;">
        {{- .title -}}
      </a>
      <br>
      <small style="color:#888;">{{ .pubDate }}</small>
    </li>
    {{ end }}
  </ul>
  {{ else }}
  <p>현재 블로그 글을 불러올 수 없습니다. <a href="https://blog.naver.com/connectedmind" target="_blank" rel="noopener noreferrer">네이버 블로그</a>에서 직접 확인해주세요.</p>
  {{ end }}
{{ else }}
<p>현재 블로그 글을 불러올 수 없습니다. <a href="https://blog.naver.com/connectedmind" target="_blank" rel="noopener noreferrer">네이버 블로그</a>에서 직접 확인해주세요.</p>
{{ end }}
